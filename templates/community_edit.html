{% extends "index.html" %}

{% block title %}글 수정 | 엪씨온큐 커뮤니티{% endblock %}

{% block content %}
<div class="pw-wrap">
    <h1 class="pw-heading">✏️ 글 수정</h1>

    <form method="POST" action="/community/post/{{ post.id }}/edit" id="postForm" class="pw-card">

        <!-- 카테고리 + 제목 -->
        <div class="pw-row">
            <select name="category" required class="pw-field pw-category">
                <option value="">카테고리 선택</option>
                {% if session.get('user_role') == 'admin' %}
                <option value="업데이트" {% if post.category=='업데이트' %}selected{% endif %}>🛠️ 업데이트</option>
                {% endif %}
                {% for c in ['잡담', '꿀팁', '스쿼드', '선수 후기', '전술', '강화/득템', '감독모드', '미니 페이스온', '명장면'] %}
                <option value="{{ c }}" {% if post.category==c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
            <input type="text" name="title" required maxlength="200" value="{{ post.title }}" placeholder="제목을 입력하세요"
                class="pw-field pw-title">
        </div>

        <!-- 본문 (기존 내용은 아래 숨김 칸에서 불러옴) -->
        <textarea id="initialContent" hidden>{{ post.content }}</textarea>
        <div class="pw-editor-box">
            <div id="editor"></div>
        </div>
        <input type="hidden" name="content" id="content">

        <div class="pw-actions">
            <a href="/community/post/{{ post.id }}" class="pw-btn">취소</a>
            <button type="submit" class="pw-btn pw-submit">수정 완료</button>
        </div>
    </form>
</div>

{% include "_community_editor.html" %}
{% endblock %}
