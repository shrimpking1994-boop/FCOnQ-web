{% extends "index.html" %}

{% block title %}엪씨온큐 | FC온라인 선수 DB · 티어리스트{% endblock %}

{% block content %}
<style>
    .home-container {
        max-width: 1400px;
        margin: 20px auto;
        padding: 0 10px;
    }

    /* ===== 검색 영역 ===== */
    .home-search {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 15px;
        padding: 16px 20px;
        text-align: center;
    }

    .home-search-form {
        display: flex;
        gap: 10px;
        max-width: 720px;
        margin: 0 auto;
    }

    .home-search-input-wrap {
        position: relative;
        flex: 1;
    }

    .home-search-input {
        width: 100%;
        padding: 14px 18px;
        background: var(--bg-main);
        color: var(--text-primary);
        border: 2px solid var(--border-color);
        border-radius: 25px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
    }

    .home-search-input:focus {
        border-color: #5865B8;
    }

    .home-search-input::placeholder {
        color: var(--text-secondary);
        opacity: 0.7;
    }

    .home-search-btn {
        background: #5865B8;
        border: none;
        padding: 0 32px;
        color: white;
        font-weight: bold;
        border-radius: 25px;
        white-space: nowrap;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .home-search-btn:hover {
        opacity: 0.9;
    }

    .home-autocomplete {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 1000;
        display: none;
        margin-top: 6px;
        max-height: 300px;
        overflow-y: auto;
        text-align: left;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        box-shadow: 0 4px 12px var(--shadow-main);
    }

    .home-autocomplete-item {
        padding: 10px 18px;
        color: var(--text-primary);
        cursor: pointer;
    }

    .home-autocomplete-item.active,
    .home-autocomplete-item:hover {
        background: var(--hover-bg);
    }

    @media (max-width: 768px) {
        .home-container {
            margin-top: 10px;
            padding: 0 6px;
        }

        .home-search {
            padding: 12px 10px;
        }

        .home-search-input {
            padding: 12px 16px;
            font-size: 0.95rem;
        }

        .home-search-btn {
            padding: 0 20px;
        }

        .home-card-date {
            display: none;
        }
    }

    /* ===== 요약 블록 (위아래 배치) ===== */
    .home-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 15px;
        padding: 16px;
        margin-top: 16px;
    }

    .home-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-color);
    }

    .home-card-title {
        color: var(--text-primary);
        font-size: 1.05rem;
        font-weight: 800;
    }

    .home-card-date {
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 500;
        margin-left: 6px;
    }

    .home-card-more {
        color: var(--text-secondary);
        font-size: 0.8rem;
        text-decoration: none;
        white-space: nowrap;
    }

    .home-card-more:hover {
        color: var(--primary-color);
    }

    .home-tabs {
        display: flex;
        gap: 6px;
        margin-top: 12px;
    }

    .home-tab-btn {
        padding: 6px 18px;
        background: var(--bg-main);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
    }

    .home-tab-btn.active {
        background: var(--primary-color);
        color: white;
        border-color: var(--primary-color);
    }

    /* 가로 카드 공통 */
    .home-tile-grid {
        display: grid;
        gap: 8px;
        margin-top: 12px;
    }

    .home-tc-grid {
        grid-template-columns: repeat(10, 1fr);
    }

    .home-trait-grid {
        grid-template-columns: repeat(11, 1fr);
    }

    .home-tile {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding: 12px 6px 10px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.2s, transform 0.15s;
    }

    .home-tile:hover {
        border-color: var(--primary-color);
        transform: translateY(-2px);
    }

    .home-tile-rank {
        position: absolute;
        top: 6px;
        left: 8px;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--text-secondary);
    }

    .home-tile-rank.r1 {
        color: #f5b301;
    }

    .home-tile-rank.r2 {
        color: #b8c2cc;
    }

    .home-tile-rank.r3 {
        color: #cd7f32;
    }

    .home-tile-change {
        position: absolute;
        top: 2px;
        right: 3px;
        font-size: 0.72rem;
        font-weight: 800;
    }

    .home-tile-change.up {
        color: #ff5b5b;
    }

    .home-tile-change.down {
        color: #4d9bff;
    }

    .home-tile-change.same {
        color: var(--text-secondary);
    }

    .home-tile-change.new {
        color: #20c997;
    }

    .home-tile-logo {
        width: 40px;
        height: 40px;
        object-fit: contain;
    }

    .home-tile-pos {
        min-width: 56px;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--primary-color);
        color: white;
        font-size: 0.78rem;
        font-weight: 800;
        text-align: center;
    }

    .home-tile-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.8);
        padding: 3px;
        object-fit: contain;
    }

    .home-tile-name {
        width: 100%;
        color: var(--text-primary);
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
        line-height: 1.25;
        word-break: keep-all;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        min-height: 2.5em;
    }

    .home-tile-value {
        color: var(--text-secondary);
        font-size: 0.78rem;
        white-space: nowrap;
    }

    .home-tile-value b {
        color: var(--text-primary);
    }

    .home-empty {
        padding: 30px 0;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    /* ===== 하단 3칸 (커뮤니티 / 선수 후기 / 업데이트) ===== */
    .home-bottom {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
    }

    .home-bottom .home-card {
        min-width: 0;
    }

    .home-list-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 4px;
        border-bottom: 1px solid var(--border-color);
        color: inherit;
        text-decoration: none;
        border-radius: 6px;
    }

    .home-list-row:last-child {
        border-bottom: none;
    }

    .home-list-row:hover {
        background: var(--hover-bg);
    }

    .home-list-cat {
        flex-shrink: 0;
        color: var(--text-secondary);
        font-size: 0.75rem;
    }

    .home-list-title {
        flex: 0 1 auto;
        min-width: 0;
        color: var(--text-primary);
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .home-list-cmt {
        color: var(--primary-color);
        font-size: 0.78rem;
        font-weight: 700;
        margin-left: 2px;
        flex-shrink: 0;
    }

    .home-list-date {
        flex-shrink: 0;
        color: var(--text-secondary);
        font-size: 0.75rem;
        margin-left: auto;
    }

    .home-review-face {
        width: 34px;
        height: 34px;
        border-radius: 6px;
        object-fit: cover;
        background: var(--bg-main);
        flex-shrink: 0;
    }

    .home-review-body {
        flex: 1;
        min-width: 0;
    }

    .home-review-top {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .home-review-season {
        height: 15px;
        flex-shrink: 0;
    }

    .home-review-name {
        color: var(--text-primary);
        font-size: 0.85rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .home-review-rating {
        flex-shrink: 0;
        color: #fbbf24;
        font-size: 0.75rem;
        font-weight: 700;
    }

    .home-review-text {
        color: var(--text-secondary);
        font-size: 0.8rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
    }

    @media (max-width: 1100px) {
        .home-bottom {
            grid-template-columns: 1fr;
            gap: 0;
        }
    }

    @media (max-width: 1100px) {
        .home-tc-grid {
            grid-template-columns: repeat(5, 1fr);
        }

        .home-trait-grid {
            grid-template-columns: repeat(6, 1fr);
        }
    }

    @media (max-width: 768px) {
        .home-card {
            padding: 12px;
            margin-top: 12px;
        }

        .home-tc-grid {
            grid-template-columns: repeat(5, 1fr);
        }

        .home-trait-grid {
            grid-template-columns: repeat(4, 1fr);
        }

        .home-tile-grid {
            gap: 6px;
        }

        .home-tile {
            padding: 10px 4px 8px;
            gap: 4px;
        }

        .home-tile-logo,
        .home-tile-icon {
            width: 32px;
            height: 32px;
        }

        .home-tile-name {
            font-size: 0.74rem;
        }

        .home-tile-value {
            font-size: 0.7rem;
        }

        .home-tile-pos {
            min-width: 0;
            padding: 2px 6px;
            font-size: 0.7rem;
        }

        .home-tabs .home-tab-btn {
            flex: 1;
            padding: 6px 0;
        }

        .home-tile-sep {
            display: none;
        }

        .home-tile-count {
            display: block;
            text-align: center;
        }

        .home-tile-value {
            text-align: center;
            line-height: 1.3;
        }

        .home-tile-rank {
            top: 3px;
            left: 5px;
            font-size: 0.7rem;
        }

        .home-tile-change {
            top: 3px;
            right: 5px;
            font-size: 0.62rem;
        }

        .home-tc-grid .home-tile {
            padding-top: 14px;
        }

        .home-tc-grid .home-tile-name {
            font-size: 0.68rem;
            letter-spacing: -0.03em;
            overflow-wrap: anywhere;
        }
    }

    /* ===== 구단가치별 랭커 스쿼드 ===== */
    .home-squad-tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        position: relative;
    }

    .home-squad-tabs::-webkit-scrollbar {
        display: none;
    }

    .home-squad-tabs .home-tab-btn {
        flex: 0 0 auto;
    }

    .home-squad-filter {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
    }

    .home-squad-filter .home-tabs {
        margin-top: 0;
        min-width: 0;
    }

    .home-squad-range {
        color: var(--text-secondary);
        font-size: 0.78rem;
        white-space: nowrap;
    }

    .home-squad-wrap {
        position: relative;
        margin-top: 10px;
    }

    .home-squad-track {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        padding-bottom: 2px;
    }

    .home-squad-track::-webkit-scrollbar {
        display: none;
    }

    .home-squad-card {
        flex: 0 0 calc((100% - 36px) / 4);
        scroll-snap-align: start;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        display: block;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.2s, transform 0.15s;
    }

    .home-squad-card:hover {
        border-color: var(--primary-color);
        transform: translateY(-2px);
    }

    /* 미니 경기장 */
    .home-pitch {
        position: relative;
        aspect-ratio: 3 / 4;
        background:
            linear-gradient(to bottom, transparent calc(50% - 1px), rgba(255, 255, 255, 0.18) calc(50% - 1px), rgba(255, 255, 255, 0.18) calc(50% + 1px), transparent calc(50% + 1px)),
            repeating-linear-gradient(to bottom, #2f6b3a 0, #2f6b3a 12.5%, #2a6134 12.5%, #2a6134 25%);
    }

    .home-pitch::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 26%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
    }

    .home-pitch-player {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 14%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .hp-top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1px;
        height: 12px;
        margin-bottom: 1px;
    }

    .hp-trait {
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.75);
        object-fit: contain;
    }

    .hp-name {
        color: #fff;
        font-size: 0.55rem;
        font-weight: 700;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    .hp-face {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .hp-sub {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1px;
        margin-top: 1px;
        height: 11px;
        width: max-content;
        white-space: nowrap;
    }

    .hp-season {
        height: 100%;
    }

    .hp-bu {
        padding: 0 2px;
        border-radius: 2px;
        font-size: 0.5rem;
        font-weight: 800;
        line-height: 11px;
        color: #fff;
    }

    .hp-bu.bu-1 {
        background: #808080;
        color: #333;
    }

    .hp-bu.bu-bronze {
        background: #CD7F32;
        color: #333;
    }

    .hp-bu.bu-silver {
        background: #C0C0C0;
        color: #333;
    }

    .hp-bu.bu-gold {
        background: #FFD700;
        color: #333;
    }

    .hp-bu.bu-purple {
        background: linear-gradient(135deg, #6f7ec4 0%, #9be8f0 35%, #f6d5ea 70%, #d7b8f0 100%);
        color: #333;
    }

    .home-squad-info {
        padding: 10px 12px;
    }

    .home-squad-top {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .home-squad-logo {
        width: 20px;
        height: 20px;
        object-fit: contain;
        flex-shrink: 0;
    }

    .home-squad-rank {
        flex-shrink: 0;
        color: var(--primary-color);
        font-size: 0.85rem;
        font-weight: 800;
    }

    .home-squad-nick {
        flex: 1;
        min-width: 0;
        color: var(--text-primary);
        font-size: 0.85rem;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .home-squad-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        font-size: 0.78rem;
        color: var(--text-secondary);
    }

    .home-squad-tcwrap {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex: 1;
    }

    .home-squad-tc {
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .home-squad-meta b {
        color: #f5a623;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .home-squad-arrow {
        position: absolute;
        top: 40%;
        transform: translateY(-50%);
        z-index: 2;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border-color);
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 2px 8px var(--shadow-main);
    }

    .home-squad-arrow.prev {
        left: -12px;
    }

    .home-squad-arrow.next {
        right: -12px;
    }

    .home-squad-counter {
        display: none;
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 2;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        pointer-events: none;
    }

    @media (max-width: 1100px) {
        .home-squad-card {
            flex-basis: calc((100% - 24px) / 3);
        }
    }

    @media (max-width: 768px) {
        .home-squad-card {
            flex-basis: 100%;
        }

        .home-squad-arrow {
            width: 30px;
            height: 30px;
            opacity: 0.85;
        }

        .home-squad-arrow.prev {
            left: 6px;
        }

        .home-squad-arrow.next {
            right: 6px;
        }

        .home-squad-counter {
            display: block;
        }

        .home-squad-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            overflow: visible;
        }

        .home-squad-tabs .home-tab-btn {
            padding: 6px 0;
        }

        .home-squad-filter {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .home-squad-range {
            white-space: normal;
        }
    }
</style>

<div class="home-container">

    <!-- 선수 검색 -->
    <section class="home-search">

        <form class="home-search-form" id="homeSearchForm" action="/search" method="GET">
            <div class="home-search-input-wrap">
                <input type="text" class="home-search-input" name="player_name" id="homeSearchInput"
                    placeholder="선수 이름을 입력하세요." autocomplete="off">
                <div class="home-autocomplete" id="homeAutocomplete"></div>
            </div>
            <button type="submit" class="home-search-btn">검색</button>
        </form>
    </section>

    <!-- 인기 팀컬러 -->
    <section class="home-card">
        <div class="home-card-head">
            <div class="home-card-title">🏆 인기 팀컬러 TOP 10<span class="home-card-date" id="homeTcDate"></span></div>
            <a class="home-card-more" href="/tierlist?tab=card">더보기 →</a>
        </div>
        <div class="home-tile-grid home-tc-grid" id="homeTeamcolorList">
            <div class="home-empty" style="grid-column: 1 / -1;">불러오는 중이에요.</div>
        </div>
    </section>


    <!-- 구단가치별 랭커 스쿼드 -->
    <section class="home-card">
        <div class="home-card-head">
            <div class="home-card-title">⚽ 구단가치별 랭커 스쿼드<span class="home-card-date" id="homeSquadDate"></span></div>
            <a class="home-card-more" href="/squad_maker">스쿼드 메이커 →</a>
        </div>
        <div class="home-squad-filter">
            <div class="home-tabs home-squad-tabs" id="homeSquadTabs"></div>
            <div class="home-squad-range" id="homeSquadRange"></div>
        </div>
        <div class="home-squad-wrap">
            <button type="button" class="home-squad-arrow prev" aria-label="이전">‹</button>
            <div class="home-squad-counter" id="homeSquadCounter"></div>
            <div class="home-squad-track" id="homeSquadList">
                <div class="home-empty" style="width:100%;">불러오는 중이에요.</div>
            </div>
            <button type="button" class="home-squad-arrow next" aria-label="다음">›</button>
        </div>
    </section>

    <!-- 포지션별 신규 특성 1위 -->
    <section class="home-card">
        <div class="home-card-head">
            <div class="home-card-title">✨ 포지션별 신규 특성 1위<span class="home-card-date" id="homeTraitDate"></span></div>
            <a class="home-card-more" href="/tierlist?tab=trait">더보기 →</a>
        </div>
        <div class="home-tabs">
            <button type="button" class="home-tab-btn active" data-source="ranker">🃏 카드 고유픽</button>
            <button type="button" class="home-tab-btn" data-source="nexon">🎯 8강 선택픽</button>
        </div>
        <div class="home-tile-grid home-trait-grid" id="homeTraitList">
            <div class="home-empty" style="grid-column: 1 / -1;">불러오는 중이에요.</div>
        </div>
    </section>

<script>
    (function () {
        const form = document.getElementById('homeSearchForm');
        const input = document.getElementById('homeSearchInput');
        const list = document.getElementById('homeAutocomplete');
        let playerNames = [];
        let focusIdx = -1;

        // 자동완성용 선수 이름 (선수 DB와 같은 데이터)
        fetch('/api/player_names')
            .then(res => res.json())
            .then(data => { playerNames = data; })
            .catch(() => { });

        function goSearch(name) {
            const value = (name || '').trim();
            if (typeof gtag === 'function') {
                gtag('event', 'home_search', { query: value || '(빈 검색)', transport_type: 'beacon' });
            }
            sessionStorage.removeItem('searchState');
            sessionStorage.removeItem('searchResultsData');
            window.location.href = value
                ? '/search?player_name=' + encodeURIComponent(value)
                : '/search';
        }

        function closeList() {
            list.style.display = 'none';
            focusIdx = -1;
        }

        function highlight() {
            const items = list.querySelectorAll('.home-autocomplete-item');
            items.forEach((el, i) => el.classList.toggle('active', i === focusIdx));
        }

        input.addEventListener('input', function () {
            const value = this.value.trim();
            if (playerNames.length === 0 || value.length < 2) {
                closeList();
                return;
            }
            const filtered = playerNames.filter(p => p.name.includes(value)).slice(0, 10);
            if (filtered.length === 0) {
                closeList();
                return;
            }
            list.innerHTML = filtered.map(p =>
                `<div class="home-autocomplete-item" data-name="${p.name.replace(/"/g, '&quot;')}">${p.name}</div>`
            ).join('');
            list.style.display = 'block';
            focusIdx = -1;
        });

        // 자동완성 항목 클릭 → 바로 검색
        list.addEventListener('click', function (e) {
            const item = e.target.closest('.home-autocomplete-item');
            if (item) goSearch(item.dataset.name);
        });

        // 방향키로 항목 이동
        input.addEventListener('keydown', function (e) {
            const items = list.querySelectorAll('.home-autocomplete-item');
            if (list.style.display !== 'block' || items.length === 0) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                focusIdx = (focusIdx + 1) % items.length;
                highlight();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                focusIdx = (focusIdx - 1 + items.length) % items.length;
                highlight();
            } else if (e.key === 'Escape') {
                closeList();
            }
        });

        // 검색 버튼 / 엔터: 방향키로 고른 항목이 있으면 그 이름, 없으면 입력한 글자로 검색
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const items = list.querySelectorAll('.home-autocomplete-item');
            if (list.style.display === 'block' && focusIdx >= 0 && items[focusIdx]) {
                goSearch(items[focusIdx].dataset.name);
            } else {
                goSearch(input.value);
            }
        });

        // 바깥 클릭 시 닫기
        document.addEventListener('click', function (e) {
            if (!input.contains(e.target) && !list.contains(e.target)) closeList();
        });
    })();
</script>
<script>
    // ===== 홈 요약 블록 (인기 팀컬러 / 포지션별 신규 특성) =====

        const EMPTY = msg => `<div class="home-empty" style="grid-column: 1 / -1;">${msg}</div>`;

        function rankChangeHtml(change) {
            if (change === null || change === undefined) return '';
            if (change === 'new') return '<span class="home-tile-change new">NEW</span>';
            if (change > 0) return `<span class="home-tile-change up">▲${change}</span>`;
            if (change < 0) return `<span class="home-tile-change down">▼${Math.abs(change)}</span>`;
            return '<span class="home-tile-change same">-</span>';
        }

        function renderTeamcolors() {
            const box = document.getElementById('homeTeamcolorList');
            const list = summary.teamcolors || [];
            if (!list.length) {
                box.innerHTML = EMPTY('데이터가 없어요.');
                return;
            }
            const tcDate = summary.teamcolor_date || '';
            const prevDate = summary.teamcolor_prev_date || '';
            document.getElementById('homeTcDate').textContent = prevDate ? `${prevDate} → ${tcDate}` : tcDate;
            box.innerHTML = list.map(t => `
                <a class="home-tile" href="/tierlist?tab=card&tc=${encodeURIComponent(t.name)}">
                    <span class="home-tile-rank ${t.rank <= 3 ? 'r' + t.rank : ''}">${t.rank}</span>
                    ${rankChangeHtml(t.change)}
                    ${t.logo ? `<img class="home-tile-logo" src="${t.logo}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span class="home-tile-logo"></span>'}
                    <span class="home-tile-name">${t.name}</span>
                    <span class="home-tile-value"><b>${(t.ratio * 100).toFixed(1)}%</b><span class="home-tile-sep"> · </span><span class="home-tile-count">${t.count.toLocaleString()}명</span></span>
                </a>`).join('');
        }

        function renderTraits() {
            const box = document.getElementById('homeTraitList');
            const data = (summary.traits || {})[traitSource] || {};
            document.getElementById('homeTraitDate').textContent = (summary.trait_dates || {})[traitSource] || '';
            const rows = POS_ORDER.filter(pos => data[pos]);
            if (!rows.length) {
                box.innerHTML = EMPTY('데이터가 없어요.');
                return;
            }
            box.innerHTML = rows.map(pos => {
                const t = data[pos];
                const icon = TRAIT_ICON_MAP[t.name];
                return `
                <a class="home-tile" href="/tierlist?tab=trait&pos=${pos}">
                    <span class="home-tile-pos">${POS_LABEL[pos] || pos}</span>
                    ${icon ? `<img class="home-tile-icon" src="${TRAIT_ICON_BASE}${icon}.png" alt="" loading="lazy">` : '<span class="home-tile-icon"></span>'}
                    <span class="home-tile-name">${t.name}</span>
                    <span class="home-tile-value"><b>${(t.ratio * 100).toFixed(1)}%</b></span>
                </a>`;
            }).join('');
        }

        function esc(text) {
            const d = document.createElement('div');
            d.textContent = text == null ? '' : String(text);
            return d.innerHTML;
        }

        function renderBottom() {
            const posts = summary.community || [];
            document.getElementById('homeCommunityList').innerHTML = posts.length
                ? posts.map(p => `
                    <a class="home-list-row" href="/community/post/${p.id}">
                        <span class="home-list-cat">${esc(p.category === '미니 페이스온' ? '미페' : p.category)}</span>
                        <span class="home-list-title">${esc(p.title)}</span>
                        ${p.comment_count ? `<span class="home-list-cmt">[${p.comment_count}]</span>` : ''}
                        <span class="home-list-date">${p.date}</span>
                    </a>`).join('')
                : '<div class="home-empty">아직 글이 없어요.</div>';

            const reviews = summary.reviews || [];
            document.getElementById('homeReviewList').innerHTML = reviews.length
                ? reviews.map(r => {
                    const pid = parseInt(String(r.spid).slice(-6));
                    return `
                    <a class="home-list-row" href="/player_review/${r.spid}">
                        <img class="home-review-face" src="https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p${r.spid}.png" alt="" loading="lazy"
                            onerror="this.onerror=null; this.src='https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/playersHigh/p${pid}.png';">
                        <div class="home-review-body">
                            <div class="home-review-top">
                                ${r.season_img ? `<img class="home-review-season" src="${r.season_img}" alt="" loading="lazy">` : ''}
                                <span class="home-review-name">${esc(r.player_name)}</span>
                            </div>
                            <div class="home-review-text">${esc(r.content)}</div>
                        </div>
                        <span class="home-list-date">${r.date}</span>
                    </a>`;
                }).join('')
                : '<div class="home-empty">아직 후기가 없어요.</div>';

            const updates = summary.updates || [];
            document.getElementById('homeUpdateList').innerHTML = updates.length
                ? updates.map(u => `
                    <a class="home-list-row" href="/community/post/${u.id}">
                        <span class="home-list-title">${esc(u.title)}</span>
                        <span class="home-list-date">${u.date}</span>
                    </a>`).join('')
                : '<div class="home-empty">아직 업데이트 소식이 없어요.</div>';
        }

        document.querySelectorAll('.home-tab-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.home-tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                traitSource = this.dataset.source;
                if (typeof gtag === 'function') {
                    gtag('event', 'home_trait_tab', { tab: traitSource });
                }
                if (summary) renderTraits();
            });
        });

        fetch('/api/home_summary')
            .then(res => res.json())
            .then(data => {
                if (!data.success) throw new Error();
                summary = data;
                renderTeamcolors();
                renderTraits();
                renderBottom();
            })
            .catch(() => {
                document.getElementById('homeTeamcolorList').innerHTML = EMPTY('불러오지 못했어요.');
                document.getElementById('homeTraitList').innerHTML = EMPTY('불러오지 못했어요.');
                ['homeCommunityList', 'homeReviewList', 'homeUpdateList'].forEach(id => {
                    document.getElementById(id).innerHTML = '<div class="home-empty">불러오지 못했어요.</div>';
                });
            });
    })();
</script>
<script>
    // ===== 구단가치별 랭커 스쿼드 =====
    (function () {
        const POS_COORDS = {
            LW: [13, 12], LF: [23, 32], LS: [11, 35], ST: [10, 50], CF: [23, 50], RF: [23, 68], RS: [11, 65], RW: [13, 88],
            LAM: [30, 24], CAM: [30, 50], RAM: [30, 76],
            LM: [38, 12], LCM: [40, 36], CM: [40, 50], RCM: [40, 64], RM: [38, 88],
            LDM: [55, 35], CDM: [57, 50], RDM: [55, 65],
            LWB: [68, 12], LB: [74, 12], LCB: [74, 38], CB: [73, 50], SW: [77, 50], RCB: [74, 62], RB: [74, 88], RWB: [68, 88],
            GK: [91, 50]
        };

        const SQ_TRAIT_ICON = {
            "아크로바틱 피니셔": "trait_icon_50", "크로스 포쳐": "trait_icon_51", "라인 브레이커": "trait_icon_52",
            "와일드 태클러": "trait_icon_53", "체이서": "trait_icon_54", "2개의 심장": "trait_icon_55",
            "파이터": "trait_icon_56", "GK 빠른 반응": "trait_icon_57", "커맨더": "trait_icon_59",
            "GK 공중볼 장악": "trait_icon_60", "블로커": "trait_icon_62", "스피드스터": "trait_icon_63",
            "타이탄": "trait_icon_64", "트릭스터": "trait_icon_65", "레이저 슈터": "trait_icon_66",
            "프레데터": "trait_icon_67", "GK 데드아이": "trait_icon_68"
        };
        const track = document.getElementById('homeSquadList');
        let buckets = [];
        let current = 0;

        function formatValue(v) {
            if (!v) return '-';
            if (v >= 1e12) return (v / 1e12).toFixed(1).replace(/\.0$/, '') + '조 BP';
            if (v >= 1e8) return (v / 1e8).toFixed(1).replace(/\.0$/, '') + '억 BP';
            return Math.floor(v / 1e4).toLocaleString() + '만 BP';
        }

        function rangeText(b) {
            const lo = formatValue(b.min).replace(' BP', '');
            if (b.max === null) return `${lo} 이상 · 상위 랭커 순`;
            return `${lo} 이상 ${formatValue(b.max).replace(' BP', '')} 미만 · 상위 랭커 순`;
        }

        function cardHtml(s) {
            const players = s.squad.map(p => {
                const c = POS_COORDS[p.p];
                if (!c) return '';
                const pid = parseInt(String(p.spid).slice(-6));
                const b = p.b || 0;
                const buClass = b <= 1 ? 'bu-1' : b <= 4 ? 'bu-bronze' : b <= 7 ? 'bu-silver' : b <= 10 ? 'bu-gold' : 'bu-purple';
                return `<div class="home-pitch-player" style="top:${c[0]}%; left:${c[1]}%;">
                    <div class="hp-top">
                        ${b ? `<span class="hp-bu ${buClass}">+${b}</span>` : ''}
                        ${p.trait && SQ_TRAIT_ICON[p.trait] ? `<img class="hp-trait" src="https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/traits/${SQ_TRAIT_ICON[p.trait]}.png" alt="" title="${p.trait}">` : ''}
                    </div>
                    <img class="hp-face" src="https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/playersAction/p${p.spid}.png" alt="" loading="lazy"
                        onerror="this.onerror=null; this.src='https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/playersHigh/p${pid}.png'; this.onerror=function(){this.onerror=null; this.src='https://fco.dn.nexoncdn.co.kr/live/externalAssets/common/players/not_found.png';};">
                    <div class="hp-sub">
                        ${p.season ? `<img class="hp-season" src="${p.season}" alt="" loading="lazy">` : ''}
                        <span class="hp-name">${p.name || ''}</span>
                    </div>
                </div>`;
            }).join('');
            return `
                <a class="home-squad-card" href="/squad_maker?ranker_tc=${encodeURIComponent(s.teamcolor)}&ranker_rank=${s.rank}"
                    ${window.innerWidth > 768 ? 'target="_blank" rel="noopener"' : ''}>
                    <div class="home-pitch">${players}</div>
                    <div class="home-squad-info">
                        <div class="home-squad-top">
                            <span class="home-squad-rank">${s.rank.toLocaleString()}위</span>
                            <span class="home-squad-nick">${(s.nickname || '').replace(/</g, '&lt;')}</span>
                        </div>
                        <div class="home-squad-meta">
                            <span class="home-squad-tcwrap">
                                ${s.logo ? `<img class="home-squad-logo" src="${s.logo}" alt="" loading="lazy">` : ''}
                                <span class="home-squad-tc">${s.teamcolor}</span>
                            </span>
                            <b>${formatValue(s.value)}</b>
                        </div>
                    </div>  
                </a>`;

        }

        const counter = document.getElementById('homeSquadCounter');
        function updateCounter() {
            const cards = track.querySelectorAll('.home-squad-card');
            const prevBtn = document.querySelector('.home-squad-arrow.prev');
            const nextBtn = document.querySelector('.home-squad-arrow.next');
            if (!cards.length) {
                counter.textContent = '';
                prevBtn.style.visibility = nextBtn.style.visibility = 'hidden';
                return;
            }
            const idx = Math.round(track.scrollLeft / (cards[0].offsetWidth + 12)) + 1;
            counter.textContent = `${Math.min(idx, cards.length)} / ${cards.length}`;

            // 처음이면 왼쪽, 끝이면 오른쪽 화살표 숨기기
            prevBtn.style.visibility = track.scrollLeft <= 2 ? 'hidden' : '';
            nextBtn.style.visibility = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2 ? 'hidden' : '';
        }
        track.addEventListener('scroll', () => requestAnimationFrame(updateCounter));

        function render() {
            const b = buckets[current];
            document.getElementById('homeSquadRange').textContent = rangeText(b);
            track.innerHTML = b.squads.length
                ? b.squads.map(cardHtml).join('')
                : '<div class="home-empty" style="width:100%;">이 구간에 해당하는 랭커 스쿼드가 없어요.</div>';
            track.scrollLeft = 0;
            updateCounter();
        }

        function renderTabs() {
            const tabs = document.getElementById('homeSquadTabs');
            tabs.innerHTML = buckets.map((b, i) =>
                `<button type="button" class="home-tab-btn ${i === current ? 'active' : ''}" data-idx="${i}">${b.label}</button>`
            ).join('');
            tabs.querySelectorAll('.home-tab-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    current = Number(this.dataset.idx);
                    tabs.querySelectorAll('.home-tab-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    render();
                    if (typeof gtag === 'function') {
                        gtag('event', 'home_squad_tab', { bucket: buckets[current].label });
                    }
                });
            });
        }

        // PC 화살표: 카드 한 장씩 이동
        document.querySelectorAll('.home-squad-arrow').forEach(btn => {
            btn.addEventListener('click', function () {
                const card = track.querySelector('.home-squad-card');
                const step = card ? card.offsetWidth + 12 : track.clientWidth;
                track.scrollBy({ left: this.classList.contains('next') ? step : -step });
                setTimeout(updateCounter, 400);
            });
        });

        fetch('/api/home_squads')
            .then(res => res.json())
            .then(data => {
                if (!data.success || !data.buckets.length) throw new Error();
                buckets = data.buckets;
                current = Math.min(2, buckets.length - 1);  // 처음엔 3번째(~30억) 탭
                document.getElementById('homeSquadDate').textContent = data.date || '';
                renderTabs();
                render();
                // 모바일에서 선택된 탭이 화면 밖이면 보이도록 가로 스크롤 이동
                const tabs = document.getElementById('homeSquadTabs');
                const act = tabs.querySelector('.active');
                if (act) tabs.scrollLeft = act.offsetLeft - (tabs.clientWidth - act.offsetWidth) / 2;
            })
            .catch(() => {
                track.innerHTML = '<div class="home-empty" style="width:100%;">불러오지 못했어요.</div>';
            });
    })();
</script>

            homeTeamcolorList: 'teamcolor', homeTraitList: 'new_trait',
            homeCommunityList: 'community', homeReviewList: 'review', homeUpdateList: 'update',
            homeSquadList: 'squad'

            const listEl = section ? section.querySelector('[id^="home"][id$="List"]') : null;
            const block = listEl ? (BLOCKS[listEl.id] || listEl.id) : 'etc';
            const nameEl = link.querySelector('.home-tile-name, .home-list-title, .home-review-name, .home-tile-pos, .home-squad-tc');
            const item = link.classList.contains('home-card-more')
                ? '더보기'
                : (nameEl ? nameEl.textContent.trim() : link.textContent.trim()).slice(0, 50);
            gtag('event', 'home_click', { block: block, item: item, transport_type: 'beacon' });
        });
    })();
</script>
